# Method (results/2026-11-15/qa/anthropometrics_video.md): MediaPipe segment length ÷ MediaPipe eye height for
# each athlete, B/A ratio × A's tape value × (B height / A height). This cancels the camera scale and
# MediaPipe's hip-landmark bias. Uncertainty is much larger than a tape measure: ±2.5 cm thigh/shank, ±3 cm leg.
# Foot length: not measurable from this clip → Winter ratio (0.152 × height).
