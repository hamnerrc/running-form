# Narrated analysis video for RC (Athlete A), built around the key positions professional coaches judge.
# Render: cd src && ../.venv/bin/python -m runform.explainer ../results/2026-11-15/video/RC_shots.yaml
# Frame numbers are source frames (240 fps). Numbers: positions_A.md/.csv, metrics_A.csv, report_A.md.
# The white figure ("model" overlay) = published world-class mean angles (positions.MODEL_TD / MODEL_TO), sized to RC.
date: 2026-11-15
name: RC
title: "RC · sprint form vs the professionals · 15 Nov 2026"
voice: am_michael
speed: 1.0

shots:
  - say: >-
      This is RC at top speed, eight times slower than real life. Professional coaches judge a sprint stride at five key
      positions. We measured every one of them and compared him with world-class one-hundred-metre finalists and with
      college sprinters filmed the same way we filmed him.
    views: [{clip: A/sprint_2_left.mov, overlays: [{type: legend}]}]
    segments: [{from: 0, to: 300, slow: 8}]
    caption: "Compared with: 2017 World Championships 100 m finalists (Bissas 2022) · college sprinters at 10 m/s, filmed at 240 fps (Clark 2025)"

  - say: >-
      Here are the five positions. Toe-off, when the back foot leaves the ground. Top of flight. Strike, just before landing.
      Touchdown. And full support, when his body is right over the foot.
    views:
      - clip: A/sprint_1_right.mov
        zoom: 2.3
        overlays: [{type: legend}]
    segments:
      - {from: 160, to: 169, slow: 16}
      - {freeze: 170, w: 1}
      - {from: 171, to: 179, slow: 16}
      - {freeze: 180, w: 1}
      - {from: 181, to: 193, slow: 16}
      - {freeze: 194, w: 1}
      - {from: 195, to: 199, slow: 16}
      - {freeze: 200, w: 1}
      - {from: 201, to: 207, slow: 16}
      - {freeze: 208, w: 1}
    cards:
      - {text: "1  Toe-off", segs: [1]}
      - {text: "2  Top of flight", segs: [3]}
      - {text: "3  Strike", segs: [5]}
      - {text: "4  Touchdown", segs: [7]}
      - {text: "5  Full support", segs: [9]}

  - say: >-
      The biggest difference is at touchdown. Watch his right leg, in red, the one in the air. When his left foot lands, his
      right knee is still well behind his left knee, and the heel is back near his butt. Now the white figure: that's the
      world-class average, drawn to his size. Their swing knee has already come through, level with the other knee, with the
      heel tucked under the hips. Coaches call that the figure four. His thighs are thirty-four degrees apart; theirs are
      about ten.
    views:
      - clip: A/sprint_1_right.mov
        zoom: 2.6
        overlays:
          - {type: kneegap, frame: 200, swing: R, stance: L, label: "swing knee 16 cm behind the other knee"}
          - {type: model, frame: 200, stance: L, pos: td, segs: [3]}
          - {type: legend}
    segments:
      - {from: 180, to: 199, slow: 24}
      - {freeze: 200, w: 1.2}
      - {freeze: 200, min: 0.1, w: 0.01}
      - {freeze: 200, w: 2.2}
    caption: "Thigh separation at touchdown −34 ± 12° (world-class −10 ± 11°) · swing knee 21 ± 8 cm behind · swing heel 30 ± 6 cm behind the hips (avg of 8 touchdowns)"
    cards:
      - {text: "Figure 4 at touchdown:\nswing knee level with the stance knee,\nheel tucked under the hips", segs: [3]}

  - say: >-
      Why? It starts at toe-off. He pushes until his leg is completely straight, knee at about a hundred and seventy degrees
      and the hip far behind him. World-class sprinters leave the ground earlier, with the knee still bent, about a hundred
      and fifty-four degrees. Pushing all the way back costs time and leaves the leg further behind.
    views:
      - clip: A/sprint_1_right.mov
        zoom: 2.6
        overlays:
          - {type: joint, frame: 277, side: R, joint: knee, label: "push-off knee {a:.0f}°", dx: 45}
          - {type: model, frame: 277, stance: R, pos: to, segs: [3], label: "white = world-class toe-off"}
          - {type: legend}
    segments:
      - {from: 253, to: 276, slow: 24}
      - {freeze: 277, w: 1.2}
      - {freeze: 277, min: 0.1, w: 0.01}
      - {freeze: 277, w: 1.6}
    caption: "At toe-off: knee 169 ± 4° (world-class 154 ± 4°) · hip 211 ± 4° (196 ± 3°) · thigh 33° behind (25°)"

  - say: >-
      Then, in the air, the thigh comes forward too slowly. Watch the yellow line. From toe-off to the next touchdown his
      thigh swings about thirty-four degrees; a world-class sprinter's swings about forty-two. Start further back, move slower,
      and the knee arrives late.
    views:
      - clip: A/sprint_1_right.mov
        zoom: 2.3
        overlays:
          - {type: thigh, side: R, frames: [270, 310], label: "right thigh"}
          - {type: legend}
    segments:
      - {from: 262, to: 276, slow: 16}
      - {freeze: 277, w: 0.6}
      - {from: 278, to: 304, slow: 48}
      - {freeze: 305, w: 1}
    caption: "Swing thigh: 33° behind at toe-off → about vertical at the next touchdown (+1 ± 11°) · world-class: 25° behind → ≈ 17° in front"

  - say: >-
      Two more numbers go with this. Knee lift, how high the thigh comes up, is sixty-seven degrees; fast college sprinters
      reach seventy-six. And his thighs scissor at about four hundred and fifty degrees per second, where they reach almost
      five hundred. That speed is what predicts top speed among trained sprinters, and it takes strong, fast hip flexors and
      hamstrings. So strength matters, but to hit these positions, not instead of them.
    views:
      - clip: A/sprint_1_right.mov
        zoom: 2.0
        overlays:
          - {type: thigh, side: R, label: "right thigh"}
          - {type: legend}
    segments: [{from: 300, to: 420, slow: 12}]
    caption: "Knee lift 67 ± 4° (college sprinters 76 ± 6°) · thigh angular velocity 447 ± 36 °/s (483 ± 29) · front-side share 67% (73%)"

  - say: >-
      What's already at a professional level is the landing itself. His shin, his knee, and where the foot lands under his
      body all match the world-class numbers, and his ground contact is short and stiff, about a tenth of a second. The first
      video was wrong to call touchdown distance the problem. It's the other leg.
    views:
      - clip: A/sprint_1_right.mov
        zoom: 2.4
        overlays: [{type: contact, td: 253, to: 277, label: "ground contact time"}, {type: legend}]
    segments:
      - {from: 236, to: 252, slow: 24}
      - {freeze: 253, w: 1.4}
      - {from: 254, to: 277, slow: 24}
      - {freeze: 277, w: 0.6}
    caption: "Touchdown distance (toe ahead of CM) 0.37 ± 0.05 m (world-class 0.38) · stance knee 154° (156°) · shin 5° (9°) · ground contact 107 ± 10 ms"

  - say: >-
      His arms show the same thing. They swing a long way behind him, but in front the hand only reaches mid-chest. Let the
      hands come up to chin height as the knees come through.
    views:
      - clip: A/sprint_1_right.mov
        zoom: 2.4
        overlays: [{type: arm, side: R, frames: [253, 361]}, {type: legend}]
    segments:
      - {from: 253, to: 273, slow: 24}
      - {freeze: 274, w: 1}
      - {from: 275, to: 335, slow: 24}
    caption: "Shoulder range of motion 76 ± 8°, almost all behind the trunk · Olympic 200 m finalists ≈ 118–135° (second-hand)"

  - say: >-
      For the goal: twenty-one feet nine needs about nineteen point six miles an hour in the approach. His approach runs
      averaged eighteen point seven, so he needs about one more mile an hour, and a faster swing leg is part of how the step
      gets longer.
    views:
      - {clip: A/sprint_1_right.mov, anchor: 0, zoom: 1.9, tag: "flying sprint 19.0 mph"}
      - {clip: A/sprint_3_right_control.mov, anchor: 0, zoom: 1.9, tag: "approach run 18.4 mph"}
    segments: [{from: 30, to: 300, slow: 8}]
    caption: "Approach runs 18.4 & 19.1 mph (± 0.15) · flying sprints 19.0 & 19.8 · 21'9\" needs ≈ 19.6 mph approach speed"

  - say: >-
      The plan. One: recover the leg earlier, with dribbles, A-skips checking the figure four, wall-drill switches, and wicket
      runs. Two: leave the ground sooner; push down, not back. Three: strength for the positions: knee drives, hanging knee
      raises, Nordic curls and Romanian deadlifts. Next session we'll measure the same positions again, plus jumps into the pit.
    views: [{clip: A/sprint_4_left_control.mov, overlays: [{type: legend}]}]
    segments: [{from: 0, to: 418, slow: 8}]
    cards:
      - {text: "1  Figure 4 at touchdown\n“Toe up, knee up, heel forward”\nDribbles · A-skips · wall-drill switches · wicket runs"}
      - {text: "2  Leave the ground sooner\n“Push down, not back”\nFast-leg drill · straight-leg bounds", y: 420}
      - {text: "3  Strength for the positions\nKnee drives · hanging knee raises · Nordic curls · RDLs", y: 640}
    caption: "Retest targets: thigh separation −34° → −15° · push-off knee ≤ 160° · knee lift → 72°+ · approach speed → 19.6 mph"
